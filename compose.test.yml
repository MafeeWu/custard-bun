services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: companion_test
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion_test"]
      interval: 2s
      timeout: 2s
      retries: 20
