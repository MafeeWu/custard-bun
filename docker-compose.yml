x-application: &application
  build: .
  image: ai-companion-web:phase-1
  env_file: .env
  environment:
    DATABASE_URL: postgresql://companion:${POSTGRES_PASSWORD}@postgres:5432/companion
  volumes:
    - ./app.config.yml:/app/app.config.yml:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - companion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *application
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *application
    command: ["pnpm", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pnpm", "health:worker"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *application
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  companion_postgres:
