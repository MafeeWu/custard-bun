x-application: &application
  build: .
  image: ai-companion-web:phase-3
  entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.sh"]
  env_file: .env
  environment:
    POSTGRES_DB: companion
    POSTGRES_HOST: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    POSTGRES_PORT: "5432"
    POSTGRES_USER: companion
    MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:?set MODEL_API_BASE_URL}
    MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
    MODEL_ID: ${MODEL_ID:?set MODEL_ID}
  volumes:
    - ./app.config.yml:/app/app.config.yml:ro
    - ./public/characters:/app/public/characters:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - companion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *application
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *application
    command: ["pnpm", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "/app/scripts/docker-entrypoint.sh",
          "pnpm",
          "health:worker",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *application
    command: ["pnpm", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  companion_postgres:
